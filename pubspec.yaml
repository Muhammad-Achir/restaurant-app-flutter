name: restaurant_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: ^18.0.1
  flutter_timezone: ^4.1.0
  google_fonts: ^6.2.1
  http: ^1.3.0
  lottie: ^3.3.1
  provider: ^6.1.2
  readmore: ^3.0.0
  shared_preferences: ^2.5.2
  sqflite: ^2.4.1
  timezone: ^0.10.0
  path_provider: ^2.1.5
  image: ^4.5.2
  # workmanager: ^0.5.1
  workmanager:
    git:
      url: https://github.com/fluttercommunity/flutter_workmanager.git
      path: workmanager
      ref: main

  # workmanager:
  #  git:
  #    url: https://github.com/fluttercommunity/flutter_workmanager.git
  #    ref: b783000

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  test: ^1.25.8
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  fonts:
    - family: "ADLaM Display"
      fonts:
        - asset: assets/fonts/ADLaMDisplay-Regular.ttf

    - family: OpenSans
      fonts:
        - asset: assets/fonts/OpenSans_Condensed-Regular.ttf

        - asset: assets/fonts/OpenSans_Condensed-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/OpenSans_Condensed-Bold.ttf
          weight: 700
        - asset: assets/fonts/OpenSans_Condensed-Medium.ttf
          weight: 500
        - asset: assets/fonts/OpenSans_Condensed-Light.ttf
          weight: 300

  assets:
    - assets/animations/lottie/food_loading.json
    - assets/animations/lottie/no_wifi.json
